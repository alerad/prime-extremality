name = "RntPaper"
version = "0.1.0"
defaultTargets = ["RntPaper"]

[leanOptions]
relaxedAutoImplicit = false

# Every dependency is pinned to a public commit; `lake-manifest.json` locks the rest.
# LeanCert supplies: qProd / F / moment (finite q-products), exact rational
# integral and moment certificates, the prime limit `primeLambda`, the
# analytic bridge `primeLambda_eq_integral_tprod`, tail-collapse majorants,
# and the `leancert` tactic (exact polynomial integrals, interval bounds).
# This is the same commit PrimeNumberTheoremAnd and leancert-qproduct pin.

[[require]]
name = "LeanCert"
git = "https://github.com/alerad/leancert.git"
rev = "d3e7f686eb6bfdcbb987eeb931c0bab953e8f43e"

# The q-product library (`QProduct.*`, formerly `LeanCert.QProduct.*`).
[[require]]
name = "QProduct"
git = "https://github.com/alerad/leancert-qproduct.git"
rev = "4ce87955ba2adb22a99d5dbb2ecdd270c73da4b3"

# The prime number theorem: `chebyshev_asymptotic` (θ ~ id) and `MediumPNT` (error
# term), used unmodified at upstream commit 127b50e5 (Lean v4.35.0, Mathlib 56a00585).
[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "127b50e33f6033e2147921167a117af96d9ba4ea"

[[lean_lib]]
name = "RntPaper"
# Build every module, including the PrimeNumberTheoremAnd bridges.
globs = ["RntPaper", "RntPaper.+"]
