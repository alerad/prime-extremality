name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Build the development
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-github-cache: true

      - name: Axiom audit (no sorry, no custom axioms, paper results on standard axioms)
        working-directory: lean
        run: ./scripts/check-axioms.sh
